<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
<script src="/crm/crm-session.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sale Area Management - Biomed CRM</title>
    
    <!-- Tailwind CSS + daisyUI -->
    <link rel="stylesheet" href="dist/output.css">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.3.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    
    <style>
        * { font-family: 'Noto Sans Thai', sans-serif; }
    </style>
<link rel="stylesheet" href="/workspace-header.css"><link rel="stylesheet" href="/mobile-icons.css"><link rel="stylesheet" href="/crm/crm-overrides.css">
<script src="/crm/crm-language.js" defer></script></head>

<body class="min-h-screen bg-gradient-to-br from-base-200 via-base-100 to-base-200">
    <!-- Navbar (shared) -->
    <div id="navbar"></div>
    <script src="biomed-navbar.js"></script>

    <!-- Alert Bar -->
    <div id="alert-bar" class="fixed top-20 left-1/2 transform -translate-x-1/2 z-50 w-full max-w-lg px-4"></div>

    <!-- Main Content -->
    <main class="p-4 lg:p-6">
        
        <!-- Breadcrumb -->
        <div class="breadcrumbs text-sm mb-4">
            <ul>
                <li><a href="management.html"><i class="fas fa-cog mr-1"></i>Management</a></li>
                <li><a href="management.html#saleareas"><i class="fas fa-map-marker-alt mr-1"></i>Sale Areas</a></li>
                <li class="text-primary font-semibold" id="breadcrumbAreaName">Loading...</li>
            </ul>
        </div>

        <!-- Sale Area Info Card -->
        <div class="card bg-base-100 shadow-lg">
            <div class="card-body">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="card-title text-2xl">
                        <i class="fas fa-map-marker-alt text-warning mr-2"></i>
                        Sale Area Management
                    </h2>
                    <div class="badge badge-warning badge-outline" id="areaIdBadge">ID: --</div>
                </div>
                
                <!-- Area Name -->
                <fieldset class="fieldset mb-4">
                    <legend class="fieldset-legend">Area Name</legend>
                    <input type="text" id="areaName" class="input input-bordered w-full" placeholder="Enter area name">
                </fieldset>
                
                <!-- Description -->
                <fieldset class="fieldset mb-4">
                    <legend class="fieldset-legend">Description</legend>
                    <textarea id="areaDescription" class="textarea textarea-bordered w-full" rows="3" placeholder="Enter description (optional)"></textarea>
                </fieldset>
                
                <div class="card-actions justify-between mt-4">
                    <button type="button" class="btn btn-error btn-outline gap-2" onclick="deleteSaleArea()">
                        <i class="fas fa-trash"></i>
                        Delete Area
                    </button>
                    <div class="flex gap-2">
                        <a href="management.html" class="btn btn-ghost gap-2">
                            <i class="fas fa-arrow-left"></i>
                            Back
                        </a>
                        <button type="button" class="btn btn-primary gap-2" onclick="saveSaleArea()">
                            <i class="fas fa-save"></i>
                            Save Changes
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="footer footer-center p-4 bg-base-200 text-base-content mt-8">
        <aside>
            <p>© 2024 Biomed Diagnostics - ERP System v2.0</p>
        </aside>
    </footer>

    <!-- Scripts -->
    <script src="biomed-global.js"></script>
    <script src="biomed-manage-salearea.js"></script>
    <script src="biomed-quickNav.js"></script>
    
    <script>
        // Theme functions
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('biomed-theme', theme);
        }
        
        // Load saved theme
        const savedTheme = localStorage.getItem('biomed-theme');
        if (savedTheme) {
            setTheme(savedTheme);
        }
        
        // Clear cache
        function clearCache() {
            if (confirm('ต้องการล้าง Cache หรือไม่?')) {
                localStorage.clear();
                sessionStorage.clear();
                location.reload();
            }
        }
        
        // Logout
        function logout() {
            if (confirm('ต้องการออกจากระบบหรือไม่?')) {
                removeToken();
                window.location.href = 'login.html';
            }
        }
    </script>
</body>

</html>
