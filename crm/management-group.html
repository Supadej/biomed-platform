<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
<script src="/crm/crm-session.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Management - Biomed CRM</title>
    
    <!-- Tailwind CSS + daisyUI -->
    <link rel="stylesheet" href="dist/output.css">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.3.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    
    <style>
        * { font-family: 'Noto Sans Thai', sans-serif; }
        
        .member-badge {
            transition: all 0.2s ease;
        }
        .member-badge:hover {
            transform: scale(1.05);
        }
    </style>
<link rel="stylesheet" href="/workspace-header.css"><link rel="stylesheet" href="/mobile-icons.css"><link rel="stylesheet" href="/crm/crm-overrides.css">
<script src="/crm/crm-language.js" defer></script></head>

<body class="min-h-screen bg-gradient-to-br from-base-200 via-base-100 to-base-200">
    <!-- Navbar (shared) -->
    <div id="navbar"></div>
    <script src="biomed-navbar.js"></script>

    <!-- Alert Bar -->
    <div id="alert-bar" class="fixed top-20 left-1/2 transform -translate-x-1/2 z-50 w-full max-w-lg px-4"></div>

    <!-- Main Content -->
    <main class="p-4 lg:p-6">
        
        <!-- Breadcrumb -->
        <div class="breadcrumbs text-sm mb-4">
            <ul>
                <li><a href="management.html"><i class="fas fa-cog mr-1"></i>Management</a></li>
                <li><a href="management.html#groups"><i class="fas fa-layer-group mr-1"></i>Groups</a></li>
                <li class="text-primary font-semibold" id="breadcrumbGroupName">Loading...</li>
            </ul>
        </div>

        <!-- Group Info Card -->
        <div class="card bg-base-100 shadow-lg">
            <div class="card-body">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="card-title text-2xl">
                        <i class="fas fa-layer-group text-primary mr-2"></i>
                        Group Management
                    </h2>
                    <div class="badge badge-primary badge-outline" id="groupIdBadge">ID: --</div>
                </div>
                
                <!-- Group Name -->
                <fieldset class="fieldset mb-4">
                    <legend class="fieldset-legend">Group Name</legend>
                    <input type="text" id="groupName" class="input input-bordered w-full" placeholder="Enter group name">
                </fieldset>
                
                <!-- Members Section -->
                <fieldset class="fieldset mb-4">
                    <legend class="fieldset-legend">
                        <i class="fas fa-users mr-1"></i>
                        Members
                    </legend>
                    
                    <!-- Current Members Display -->
                    <div id="mainUsersList" class="flex flex-wrap gap-2 p-3 bg-base-200 rounded-lg min-h-[60px] mb-3">
                        <span class="loading loading-dots loading-sm"></span>
                    </div>
                    
                    <!-- Add/Edit Members Button -->
                    <button class="btn btn-outline btn-sm gap-2" onclick="openMembersModal()">
                        <i class="fas fa-user-plus"></i>
                        Edit Members
                    </button>
                </fieldset>
                
                <div class="card-actions justify-end mt-4">
                    <a href="management.html" class="btn btn-ghost gap-2">
                        <i class="fas fa-arrow-left"></i>
                        Back
                    </a>
                    <button type="button" class="btn btn-primary gap-2" onclick="saveGroup()">
                        <i class="fas fa-save"></i>
                        Save Changes
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- Members Selection Modal -->
    <dialog id="membersModal" class="modal">
        <div class="modal-box w-11/12 max-w-2xl">
            <h3 class="font-bold text-lg mb-4">
                <i class="fas fa-users text-primary mr-2"></i>
                Select Members
            </h3>
            
            <!-- Members Selection -->
            <div class="mb-4">
                <label class="label">
                    <span class="label-text font-semibold">Group Members</span>
                </label>
                <div id="usersCheckboxList" class="grid grid-cols-1 md:grid-cols-2 gap-2 max-h-64 overflow-y-auto p-2 border border-base-300 rounded-lg">
                    <span class="loading loading-dots loading-sm"></span>
                </div>
            </div>
            
            <!-- Selected Members Preview -->
            <div class="mb-4">
                <label class="label">
                    <span class="label-text font-semibold">Selected Members</span>
                </label>
                <div id="modalUsersList" class="flex flex-wrap gap-2 p-3 bg-base-200 rounded-lg min-h-[50px]">
                    <span class="text-base-content/50 text-sm">No members selected</span>
                </div>
            </div>
            
            <div class="modal-action">
                <form method="dialog">
                    <button class="btn btn-ghost">Cancel</button>
                </form>
                <button class="btn btn-primary" onclick="confirmMemberSelection()">
                    <i class="fas fa-check mr-1"></i>
                    Confirm
                </button>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop">
            <button>close</button>
        </form>
    </dialog>

    <!-- Footer -->
    <footer class="footer footer-center p-4 bg-base-200 text-base-content mt-8">
        <aside>
            <p>© 2024 Biomed Diagnostics - ERP System v2.0</p>
        </aside>
    </footer>

    <!-- Scripts -->
    <script src="biomed-global.js"></script>
    <script src="biomed-manage-group.js"></script>
    <script src="biomed-quickNav.js"></script>
    
    <script>
        // Theme functions
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('biomed-theme', theme);
        }
        
        // Load saved theme
        const savedTheme = localStorage.getItem('biomed-theme');
        if (savedTheme) {
            setTheme(savedTheme);
        }
        
        // Clear cache
        function clearCache() {
            if (confirm('ต้องการล้าง Cache หรือไม่?')) {
                localStorage.clear();
                sessionStorage.clear();
                location.reload();
            }
        }
        
        // Logout
        function logout() {
            if (confirm('ต้องการออกจากระบบหรือไม่?')) {
                removeToken();
                window.location.href = 'login.html';
            }
        }
    </script>
</body>

</html>
