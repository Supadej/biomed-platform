<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<script src="/crm/crm-session.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Biomed CRM</title>
    
    <link rel="stylesheet" href="dist/output.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        * { font-family: 'Noto Sans Thai', sans-serif; }
        
        /* Loader */
        #loader { display: flex; }
        #loader.hidden { display: none; }
        
        /* Profile gradient */
        .profile-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: oklch(var(--p) / 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: oklch(var(--p) / 0.5); }
        
        /* Event & Target horizontal scroll */
        #eventContainer, #targetContainer {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding: 0.5rem 0.25rem;
            scroll-snap-type: x mandatory;
        }
        
        /* Event Card */
        .event-card {
            min-width: 280px;
            max-width: 280px;
            scroll-snap-align: start;
            background: linear-gradient(145deg, oklch(var(--b1)) 0%, oklch(var(--b2)) 100%);
            border: 1px solid oklch(var(--bc) / 0.1);
            transition: all 0.3s ease;
        }
        .event-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -8px oklch(var(--bc) / 0.15);
        }
        
        /* Target Card */
        .target-card {
            min-width: 260px;
            max-width: 260px;
            scroll-snap-align: start;
            background: linear-gradient(145deg, oklch(var(--b1)) 0%, oklch(var(--b2)) 100%);
            border: 1px solid oklch(var(--bc) / 0.1);
            transition: all 0.3s ease;
        }
        .target-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -8px oklch(var(--bc) / 0.15);
        }
        
        /* Status badges */
        .status-need-report { 
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }
        .status-occurring { 
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
        }
        .status-today { 
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            color: white;
        }
        .status-tomorrow { 
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }
        .status-upcoming { 
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            color: white;
        }
        
        /* Info row in target */
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.375rem 0;
            border-bottom: 1px dashed oklch(var(--bc) / 0.1);
        }
        .info-row:last-child { border-bottom: none; }
        
        /* ========================================
           Legacy CSS for biomed-indexv2.js
           ======================================== */
        .c-surface { 
            background: linear-gradient(145deg, oklch(var(--b1)) 0%, oklch(var(--b2)) 100%);
            border: 1px solid oklch(var(--bc) / 0.1);
        }
        .c-con-surface { 
            background-color: oklch(var(--b2)); 
            color: oklch(var(--bc)); 
            padding: 0.25rem 0.5rem;
            border-radius: 0.5rem;
            font-size: 0.75rem;
        }
        .c-shadow { box-shadow: 0 8px 24px -4px oklch(var(--bc) / 0.1); }
        .c-error { 
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white; 
        }
        .c-ok { 
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white; 
        }
        .c-blue { 
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white; 
        }
        .c-primary { 
            background: linear-gradient(135deg, oklch(var(--p)) 0%, oklch(var(--pf)) 100%);
            color: oklch(var(--pc)); 
        }
        
        .rounded-5 { border-radius: 1rem; }
        .small { font-size: 0.75rem; }
        .fs-6 { font-size: 1rem; font-weight: 600; }
        .text-nowrap { white-space: nowrap; }
        .text-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .flex-shrink-0 { flex-shrink: 0; }
        
        .m-0 { margin: 0 !important; }
        .m-1 { margin: 0.25rem !important; }
        .m-2 { margin: 0.5rem !important; }
        .m-3 { margin: 1rem !important; }
        .mx-2 { margin-left: 0.5rem !important; margin-right: 0.5rem !important; }
        .mx-3 { margin-left: 1rem !important; margin-right: 1rem !important; }
        .my-1 { margin-top: 0.25rem !important; margin-bottom: 0.25rem !important; }
        .my-2 { margin-top: 0.5rem !important; margin-bottom: 0.5rem !important; }
        .mt-1 { margin-top: 0.25rem !important; }
        .mt-3 { margin-top: 1rem !important; }
        .ms-2 { margin-left: 0.5rem !important; }
        
        .p-0 { padding: 0 !important; }
        .p-1 { padding: 0.25rem !important; }
        .p-2 { padding: 0.5rem !important; }
        .p-3 { padding: 1rem !important; }
        .px-3 { padding-left: 1rem !important; padding-right: 1rem !important; }
        
        .position-relative { position: relative !important; }
        .position-absolute { position: absolute !important; }
        .top-0 { top: 0 !important; }
        .start-0 { left: 0 !important; }
        .end-0 { right: 0 !important; }
        .start-50 { left: 50% !important; }
        .translate-middle { transform: translate(-50%, -50%) !important; }
        .float-end { float: right !important; }
        
        /* Animation */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeInUp 0.5s ease-out forwards; }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }
    </style>
<link rel="stylesheet" href="/workspace-header.css"><link rel="stylesheet" href="/mobile-icons.css"><link rel="stylesheet" href="/crm/crm-overrides.css">
<script src="/crm/crm-language.js" defer></script></head>

<body class="min-h-screen bg-gradient-to-br from-base-200 via-base-100 to-base-200">
    <!-- Loader -->
    <div id="loader" class="fixed inset-0 bg-base-100/95 backdrop-blur-md z-50 flex items-center justify-center">
        <div class="text-center">
            <div class="relative">
                <span class="loading loading-ring loading-lg text-primary"></span>
                <span class="loading loading-ring loading-lg text-secondary absolute inset-0 animate-ping opacity-30"></span>
            </div>
            <p class="mt-4 text-base-content/60 font-medium">กำลังโหลดข้อมูล...</p>
        </div>
    </div>
    <!-- Navbar (shared) -->
    <div id="navbar"></div>
    <script src="biomed-navbar.js"></script>

    <!-- Main Content -->
    <main class="p-4 lg:p-6">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 lg:gap-6">
            
            <!-- ========== LEFT: Profile Card ========== -->
            <div class="lg:col-span-3 animate-fade-in">
                <div class="card bg-base-100 shadow-xl overflow-hidden sticky top-20">
                    <!-- Profile Header -->
                    <div id="SakuraOverlay" class="profile-gradient p-8 text-center relative overflow-hidden">
                        <!-- Decorative circles -->
                        <div class="absolute -top-10 -right-10 w-40 h-40 bg-white/10 rounded-full"></div>
                        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-white/10 rounded-full"></div>
                        
                        <div class="avatar relative z-10 group">
                            <div class="w-28 rounded-full ring-4 ring-white/40 shadow-xl relative overflow-hidden cursor-pointer" onclick="uploadProfilePic()">
                                <img class="ProfilePic" src="assets/profile-user.png" alt="Profile" />
                                <!-- Hover overlay for upload -->
                                <div class="absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                    <i class="fas fa-camera text-white text-xl"></i>
                                </div>
                            </div>
                        </div>
                        <h2 class="text-xl font-bold text-white mt-4 name drop-shadow-md"></h2>
                        <p class="text-sm text-white/80 position"></p>
                        
                        <!-- Action buttons -->
                        <div class="flex justify-center gap-2 mt-3">
                            <button class="btn btn-xs btn-ghost text-white/80 hover:text-white hover:bg-white/20" onclick="uploadProfilePic()">
                                <i class="fas fa-camera"></i> เปลี่ยนรูป
                            </button>
                            <button class="btn btn-xs btn-ghost text-white/80 hover:text-white hover:bg-white/20" onclick="openPasswordModal()">
                                <i class="fas fa-key"></i> เปลี่ยนรหัส
                            </button>
                        </div>
                    </div>
                    
                    <!-- Profile Details -->
                    <div class="card-body p-5 space-y-3">
                        <!-- Code Name -->
                        <div class="flex items-center gap-3 p-3 bg-gradient-to-r from-primary/5 to-transparent rounded-xl border-l-4 border-primary">
                            <div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center">
                                <i class="fas fa-fingerprint text-primary"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <p class="text-[10px] text-base-content/50 uppercase tracking-wider">Code Name</p>
                                <p class="font-semibold codename truncate"></p>
                            </div>
                        </div>
                        
                        <!-- Email -->
                        <div class="flex items-center gap-3 p-3 bg-gradient-to-r from-secondary/5 to-transparent rounded-xl border-l-4 border-secondary">
                            <div class="w-10 h-10 rounded-xl bg-secondary/10 flex items-center justify-center">
                                <i class="fas fa-envelope text-secondary"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <p class="text-[10px] text-base-content/50 uppercase tracking-wider">Email</p>
                                <p class="font-medium email truncate text-sm"></p>
                            </div>
                        </div>
                        
                        <!-- Phone -->
                        <div class="flex items-center gap-3 p-3 bg-gradient-to-r from-accent/5 to-transparent rounded-xl border-l-4 border-accent">
                            <div class="w-10 h-10 rounded-xl bg-accent/10 flex items-center justify-center">
                                <i class="fas fa-phone text-accent"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <p class="text-[10px] text-base-content/50 uppercase tracking-wider">Phone</p>
                                <p class="font-semibold tel"></p>
                            </div>
                        </div>
                        
                        <div class="divider text-xs my-3">
                            <span class="bg-base-200 px-3 py-1 rounded-full text-base-content/50">Areas & Products</span>
                        </div>
                        
                        <!-- Sale Areas -->
                        <div class="space-y-2">
                            <p class="text-xs font-medium text-base-content/70 flex items-center gap-2">
                                <i class="fas fa-map-marker-alt text-info"></i> Sale Areas
                            </p>
                            <div class="SaleAreas flex flex-wrap gap-1.5"></div>
                        </div>
                        
                        <!-- Products -->
                        <div class="space-y-2">
                            <p class="text-xs font-medium text-base-content/70 flex items-center gap-2">
                                <i class="fas fa-box text-success"></i> Products
                            </p>
                            <div class="Products flex flex-wrap gap-1.5"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            
            <!-- ========== RIGHT: Content ========== -->
            <div class="lg:col-span-9 space-y-4 lg:space-y-6">
                
                <!-- Welcome Card -->
                <div class="card bg-base-100 shadow-xl overflow-hidden animate-fade-in delay-100">
                    <div class="card-body p-6 relative">
                        <!-- Background decoration -->
                        <div class="absolute top-0 right-0 w-64 h-64 bg-gradient-to-br from-primary/5 to-secondary/5 rounded-full -translate-y-1/2 translate-x-1/2"></div>
                        
                        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 relative z-10">
                            <div>
                                <h1 class="text-2xl lg:text-3xl font-bold flex items-center gap-3">
                                    สวัสดี, <span class="name bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent"></span> 
                                    <span class="text-3xl animate-bounce">👋</span>
                                </h1>
                                <p class="text-base-content/60 mt-2">ยินดีต้อนรับสู่ระบบ Biomed Diagnostics ERP</p>
                            </div>
                            <div class="flex gap-3">
                                <div class="bg-gradient-to-br from-primary/20 to-primary/5 rounded-2xl p-4 text-center min-w-24 border border-primary/20">
                                    <div class="text-2xl font-bold text-primary" id="eventCount">-</div>
                                    <div class="text-xs text-base-content/60 mt-1">Events</div>
                                </div>
                                <div class="bg-gradient-to-br from-secondary/20 to-secondary/5 rounded-2xl p-4 text-center min-w-24 border border-secondary/20">
                                    <div class="text-2xl font-bold text-secondary" id="targetCount">-</div>
                                    <div class="text-xs text-base-content/60 mt-1">Targets</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Events Section -->
                <div class="card bg-base-100 shadow-xl animate-fade-in delay-200">
                    <div class="card-body p-5 lg:p-6">
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="text-lg font-bold flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary to-primary/50 flex items-center justify-center">
                                    <i class="fas fa-calendar-alt text-white"></i>
                                </div>
                                Events
                            </h2>
                            <a href="event.html" class="btn btn-ghost btn-sm gap-2 rounded-full hover:bg-primary/10">
                                ดูทั้งหมด <i class="fas fa-arrow-right text-xs"></i>
                            </a>
                        </div>
                        
                        <div id="eventContainer" class="min-h-[180px]">
                            <!-- JS will insert event cards here -->
                        </div>
                    </div>
                </div>
                
                <!-- Targets Section -->
                <div class="card bg-base-100 shadow-xl animate-fade-in delay-300">
                    <div class="card-body p-5 lg:p-6">
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="text-lg font-bold flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-secondary to-secondary/50 flex items-center justify-center">
                                    <i class="fas fa-bullseye text-white"></i>
                                </div>
                                CRM & Targets
                            </h2>
                            <a href="crm.html" class="btn btn-ghost btn-sm gap-2 rounded-full hover:bg-secondary/10">
                                ดูทั้งหมด <i class="fas fa-arrow-right text-xs"></i>
                            </a>
                        </div>
                        
                        <div id="targetContainer" class="min-h-[280px]">
                            <!-- JS will insert target cards here -->
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </main>

    <!-- Toast -->
    <div id="alert-bar" class="toast toast-top toast-center z-50"></div>

    <!-- Hidden file input for profile pic upload -->
    <input type="file" id="profilePicInput" class="hidden" accept="image/*" onchange="handleProfilePicUpload(this)">

    <!-- Change Password Modal -->
    <dialog id="passwordModal" class="modal">
        <div class="modal-box">
            <form method="dialog">
                <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
            </form>
            <h3 class="font-bold text-lg flex items-center gap-2">
                <i class="fas fa-key text-primary"></i> เปลี่ยนรหัสผ่าน
            </h3>
            <div class="py-4 space-y-4">
                <div class="form-control">
                    <label class="label">
                        <span class="label-text">รหัสผ่านใหม่</span>
                    </label>
                    <input type="password" id="newPassword" placeholder="กรอกรหัสผ่านใหม่" class="input input-bordered w-full" />
                </div>
                <div class="form-control">
                    <label class="label">
                        <span class="label-text">ยืนยันรหัสผ่านใหม่</span>
                    </label>
                    <input type="password" id="confirmPassword" placeholder="กรอกรหัสผ่านใหม่อีกครั้ง" class="input input-bordered w-full" />
                </div>
            </div>
            <div class="modal-action">
                <form method="dialog">
                    <button class="btn btn-ghost">ยกเลิก</button>
                </form>
                <button class="btn btn-primary" onclick="changePassword()">บันทึก</button>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop">
            <button>close</button>
        </form>
    </dialog>

    <!-- Scripts -->
    <script src="biomed-global.js"></script>
    <script src="biomed-index.js" defer></script>
    <script src="biomed-quickNav.js" defer></script>
    
    <script>
        function showLoader() {
            document.getElementById('loader')?.classList.remove('hidden');
        }
        function hideLoader() {
            document.getElementById('loader')?.classList.add('hidden');
        }
        
        // Theme functions
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('biomed-theme', theme);
        }
        
        // Load saved theme
        const savedTheme = localStorage.getItem('biomed-theme');
        if (savedTheme) {
            setTheme(savedTheme);
        }
        
        // Logout
        function logout() {
            if (confirm('ต้องการออกจากระบบหรือไม่?')) {
                removeToken();
                window.location.href = 'login.html';
            }
        }
        
        // Upload Profile Picture
        function uploadProfilePic() {
            document.getElementById('profilePicInput').click();
        }
        
        function handleProfilePicUpload(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                
                // Validate file size (max 5MB)
                if (file.size > 5 * 1024 * 1024) {
                    xalert('ไฟล์ใหญ่เกินไป (สูงสุด 5MB)', 1);
                    return;
                }
                
                // Validate file type
                if (!file.type.startsWith('image/')) {
                    xalert('กรุณาเลือกไฟล์รูปภาพเท่านั้น', 1);
                    return;
                }
                
                // Show preview immediately
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.querySelectorAll('.ProfilePic').forEach(img => {
                        img.src = e.target.result;
                    });
                };
                reader.readAsDataURL(file);
                
                // Upload to server using processImage from biomed-index.js
                if (typeof processImage === 'function') {
                    processImage(file);
                } else {
                    xalert('ไม่พบฟังก์ชันอัปโหลด', 1);
                }
            }
        }
        
        // Change Password Modal
        function openPasswordModal() {
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
            document.getElementById('passwordModal').showModal();
        }
        
        function changePassword() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (!newPassword) {
                xalert('กรุณากรอกรหัสผ่านใหม่', 1);
                return;
            }
            
            if (newPassword.length < 6) {
                xalert('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร', 1);
                return;
            }
            
            if (newPassword !== confirmPassword) {
                xalert('รหัสผ่านไม่ตรงกัน', 1);
                return;
            }
            
            // Call API to change password using updateUserPassword from biomed-index.js
            if (typeof updateUserPassword === 'function') {
                updateUserPassword(newPassword);
            } else {
                xalert('ไม่พบฟังก์ชันเปลี่ยนรหัสผ่าน', 1);
            }
            
            document.getElementById('passwordModal').close();
        }
    </script>
</body>
</html>
