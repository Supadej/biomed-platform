function download(name,mime,text){let b=new Blob([text],{type:mime}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}function downloadPreReset(){const x=BiomedStorage.getItem('biomed_budget_v65_before_reset');if(!x)return alert('No saved pre-reset snapshot is available in this browser.');download('biomed-budget-before-V65-reset.json','application/json',JSON.stringify({app:'Biomed Budgeting V65 backup',state:JSON.parse(x).years[String(JSON.parse(x).active)],yearStore:JSON.parse(x)},null,2))}function exportBackup(){download('biomed-budget-'+fyLabel()+'-all-years-backup.json','application/json',JSON.stringify({app:'Biomed Budgeting V60',state,yearStore},null,2))}function importBackup(f){if(!(budgetIsManager())){alert('Permission required from Staff Portal');return;}if(!f)return;f.text().then(t=>{try{let j=JSON.parse(t);if(!j?.state?.products||!j?.state?.expenses)throw Error('Invalid format');if(confirm('Replace the current local budgeting data?')){if(j.yearStore?.years){yearStore=j.yearStore;state=yearStore.years[String(yearStore.active)];normalize()}else{state=j.state;yearStore.years[String(yearStore.active)]=state;normalize()}save('restore');render()}}catch(e){alert('Invalid backup file')}})}function clearNumericValues(scope='current'){if(!(budgetIsManager())){alert('This action requires authorization from Staff Portal → Roles & Permissions.');return;}
 const all=scope==='all';
 const targetYears=all?Object.keys(yearStore.years):[String(yearStore.active)];
 if(!confirm(`Reset ALL numeric financial entries in ${all?'EVERY fiscal year':fyLabel()}?\n\nThis will zero revenue, COGS, expense budgets, actuals, commitments, and all Other Cost of Sales components, and clear financial ledger and approval/version records. Products, item names, cost centers, cost components, and fiscal-year structures will be preserved.\n\nExport a backup first. This cannot be undone without a backup.`))return;
 if(prompt('Type RESET to confirm numeric clearing:')!=='RESET')return;
 const zero12=()=>Array(12).fill(0);
 for(const y of targetYears){
  const s=yearStore.years[y];if(!s)continue;
  for(const p of (s.products||[])){
   for(const k of ['budget','cogsBudget','revenueActual','cogsActual'])p[k]=zero12();
   if(typeof p.revenue==='number')p.revenue=0;
   if(typeof p.cogs==='number')p.cogs=0;
  }
  for(const r of (s.expenses||[])){
   for(const k of ['budget','actual','commitment'])r[k]=zero12();
   if(typeof r.annual==='number')r.annual=0;
   for(const comp of (r.componentRows||[]))for(const k of ['budget','actual','commitment'])comp[k]=zero12();
  }
  // Workforce planning names / positions / cost-centre assignments remain intact.
  for(const r of (s.workforce||[]))for(const k of ['headcount','salary','increment','bonus','benefits'])if(typeof r[k]==='number')r[k]=0;
  s.ledger=[];s.approvals=[];s.versions=[];
 }
 state=yearStore.years[String(yearStore.active)];normalize();save(scope==='all'?'reset_all':'reset_current');render();
 alert('Numeric values cleared for '+(all?'all fiscal years':fyLabel())+'. Product and expense catalogues have been kept.');
}

function isBridge(){const source=isDocSource();const maps=isBridgeMappings();const docs=source?.documents||[];const pds=source?.products||[];const qualifying=docs.filter(d=>d.status==='Approved'&&['invoice','credit-note','purchase-order'].includes(d.kind));
 const revenueOptions='<option value="">— Unmapped —</option>'+state.products.filter(p=>p.active!==false).map(p=>`<option value="${e(p.id)}">${e(p.name)} · ${e(p.costCenter||'Unassigned')}</option>`).join('');
 const expOptions='<option value="">— Unmapped —</option>'+state.expenses.filter(p=>p.active!==false&&p.category!=='Other Cost of Sales').map(p=>`<option value="${e(p.id)}">${e(p.category)} · ${e(p.name)}</option>`).join('');
 const sourceRows=pds.map(p=>`<tr><td>${e(p.name)}</td><td>${e(p.sku||p.id)}</td><td><select data-is-map-product="${e(p.id)}">${revenueOptions.replace(`value="${e(maps.products[p.id]||'__none__')}"`, `value="${e(maps.products[p.id]||'__none__')}" selected`)}</select></td></tr>`).join('');
 const pos=qualifying.filter(d=>d.kind==='purchase-order');
 const poRows=pos.map(d=>`<tr><td>${e(d.ref)}</td><td>${fmt(isTotal(d))} ${e(d.currency||'THB')}</td><td><select data-is-map-po="${e(d.id)}">${expOptions.replace(`value="${e(maps.purchaseOrders[d.id]||'__none__')}"`, `value="${e(maps.purchaseOrders[d.id]||'__none__')}" selected`)}</select></td></tr>`).join('');
 const exceptions=isBridgeExceptions(qualifying,pds,maps);const prev=state.ledger.filter(l=>l.isSourceId);
 return heading('Biomed IS · Reconciliation','Link approved IS documents to FY-specific revenue and expense budget lines')+
 `<div class="panel"><h2>Import rules</h2><p class="help">Only explicitly mapped, approved THB transactions dated within ${fyLabel()} are eligible. Invoices and linked credit notes update revenue Actuals. Approved purchase orders create open commitments only when assigned to an expenditure line. This screen does not assume purchases are operating expenses, and does not compute inventory COGS.</p><div class="grid three"><div class="stat"><small>Eligible documents</small><b>${qualifying.length}</b></div><div class="stat"><small>Outstanding mapping / validity exceptions</small><b>${exceptions.length}</b></div><div class="stat"><small>Current-year IS ledger entries</small><b>${prev.length}</b></div></div><div class="row"><button class="btn primary" onclick="isReconcile()">Reconcile approved IS transactions</button><a class="btn" href="./biomed-is.html?source=1">Open Biomed IS ↗</a></div></div>`+
 `<div class="panel"><h2>1. Map IS products to Budgeting revenue lines</h2>${table(['IS product','Code','Budgeting product / cost center'],sourceRows?[sourceRows] : [])}<div class="row"><button class="btn" onclick="isSaveMappings()">Save product mappings</button></div></div>`+
 `<div class="panel"><h2>2. Map approved Purchase Orders to expense lines</h2><p class="help">Map only genuine expense commitments. Inventory purchases should stay unmapped until inventory/COGS recognition rules are established.</p>${table(['PO reference','Amount','Expense budget line'],poRows?[poRows]:[])}<div class="row"><button class="btn" onclick="isSaveMappings()">Save PO mappings</button></div></div>`+
 `<div class="panel"><h2>3. Exceptions requiring review</h2>${table(['Reference','Issue'],exceptions.map(x=>`<tr><td>${e(x.ref)}</td><td>${e(x.why)}</td></tr>`))}</div>`+
 `<div class="panel"><h2>4. Posted IS bridge entries · ${fyLabel()}</h2>${table(['Reference','Budget line','Month','Type','Amount THB'],prev.map(x=>`<tr><td>${e(x.reference)}</td><td>${e(x.label)}</td><td>${months[x.month]}</td><td>${e(x.type)}</td><td class="num">${fmt(x.amount)}</td></tr>`))}</div>`+
 `<div class="note">This is a browser-local demonstration. Document values may include VAT; exclude VAT and reconcile FX, returns, COGS and the general ledger before treating results as official P&L.</div>`;
}
function isTotal(d){return d.sourceVersion&&d.financials?Number(d.financials.net):(d.lines||[]).reduce((v,l)=>v+Number(l.qty||0)*Number(l.price||0),0)}
function isMonth(d){const day=String(d.date||'').slice(0,10);if(!/^\d{4}-\d\d-\d\d$/.test(day))return -1;const [y,m]=day.split('-').map(Number);const start=yearStore.active-1;return y===start&&m>=5?m-5:y===yearStore.active&&m<=4?m+7:-1}
function isBridgeExceptions(ds,products,maps){const out=[];const byId=new Map(ds.map(d=>[d.id,d]));for(const d of ds){if(isMonth(d)<0)continue;let why='';if((d.currency||'THB').toUpperCase()!=='THB')why='Foreign currency: FX rate required';else if(d.kind==='purchase-order'){if(!maps.purchaseOrders[d.id])why='PO expense line not assigned (inventory purchase may be intentionally excluded)'}else if(d.kind==='credit-note'&&(!d.sourceId||!byId.has(d.sourceId)||byId.get(d.sourceId).kind!=='invoice'))why='Credit note has no approved source invoice';else if(['invoice','credit-note'].includes(d.kind)&&(d.lines||[]).some(l=>!maps.products[l.productId]))why='One or more IS products not mapped';if(why)out.push({ref:d.ref,why})}return out}
function isSaveMappings(){if(!budgetIsManager())return alert('Budget Manage permission required');const maps=isBridgeMappings();document.querySelectorAll('[data-is-map-product]').forEach(el=>{if(el.value)maps.products[el.dataset.isMapProduct]=el.value;else delete maps.products[el.dataset.isMapProduct]});document.querySelectorAll('[data-is-map-po]').forEach(el=>{if(el.value)maps.purchaseOrders[el.dataset.isMapPo]=el.value;else delete maps.purchaseOrders[el.dataset.isMapPo]});save();render();toast('IS mappings saved for '+fyLabel())}
function isReconcile(){if(!budgetEditAccess())return alert('Budget Edit permission required');const source=isDocSource();if(!source)return alert('Open Biomed IS and create or approve transactions first.');const maps=isBridgeMappings();const docs=(source.documents||[]).filter(d=>d.status==='Approved'&&['invoice','credit-note','purchase-order'].includes(d.kind));const approvedInvoices=new Map(docs.filter(d=>d.kind==='invoice').map(d=>[d.id,d]));const entries=new Map();const exceptions=[];
 for(const d of docs){const month=isMonth(d);if(month<0)continue;if((d.currency||'THB').toUpperCase()!=='THB'){exceptions.push(d.ref+': non-THB currency');continue}
  if(d.kind==='credit-note'&&!approvedInvoices.has(d.sourceId)){exceptions.push(d.ref+': invoice reference not approved');continue}
  if(d.kind==='purchase-order'){const target=state.expenses.find(x=>x.id===maps.purchaseOrders[d.id]&&x.active!==false);if(!target){exceptions.push(d.ref+': PO not mapped to expense');continue}const amount=isTotal(d);entries.set('is:'+d.id+':po',{line:target.id,record:target,field:'commitment',type:'Commitment',amount,month,reference:d.ref});continue}
  let valid=true;for(const l of d.lines||[])if(!state.products.some(x=>x.id===maps.products[l.productId]&&x.active!==false))valid=false;
  if(!valid){exceptions.push(d.ref+': product mapping missing');continue}
  for(const l of d.lines||[]){const rec=state.products.find(x=>x.id===maps.products[l.productId]);const key='is:'+d.id+':'+l.productId;const gross=(d.lines||[]).reduce((n,x)=>n+Number(x.qty||0)*Number(x.price||0),0);const amount=(gross?Number(l.qty||0)*Number(l.price||0)/gross*isTotal(d):0)*(d.kind==='credit-note'?-1:1);const existing=entries.get(key);if(existing)existing.amount+=amount;else entries.set(key,{line:rec.id,record:rec,field:'revenueActual',type:'Actual',amount,month,reference:d.ref})}
 }
 // Replace only V68 bridge postings, not manual financial entries. Rebuild arrays from ledger records.
 for(const l of state.ledger.filter(x=>x.isSourceId)){const {record,field}=locateLine(l.line);const fld=l.type==='Commitment'?'commitment':field;if(record?.[fld]?.[l.month]!=null)record[fld][l.month]-=Number(l.amount||0)}
 state.ledger=state.ledger.filter(x=>!x.isSourceId);
 for(const [id,item] of entries){const {record,field,type,amount,month,reference,line}=item;const fld=type==='Commitment'?'commitment':field;if(!record[fld])record[fld]=Array(12).fill(0);record[fld][month]+=amount;state.ledger.push({id:rid(),isSourceId:id,date:new Date().toISOString().slice(0,10),line,label:record.name,type,month,amount,reference,note:'Biomed IS reconciliation',costCenter:record.costCenter})}
 save();render();alert(entries.size+' mapped IS entries reconciled in '+fyLabel()+'. '+exceptions.length+' documents require review. Values are unverified gross document amounts, not audited accounting postings.')
}
function budgetRequired(name,args){const k=(m,a)=>'budget.'+m+'.'+a;const master=t=>t==='product'?'manage_products':'manage_items';
 if(name==='newFiscalYear')return [k('fiscal-year','create')];if(name==='switchFiscalYear')return [k('fiscal-year','switch')];
 if(name==='updateBudget'){const rec=(args[0]==='product'?state.products:state.expenses).find(x=>x.id===args[1]),field=String(args[2]).split(':')[0];const cat=Object.entries(WORKBOOK_CATEGORY).find(([t,c])=>c===rec?.category)?.[0]||(rec?.category==='Other Cost of Sales'?'ocos':appTab);return [k(field.startsWith('cogs')?'cogs':args[0]==='product'?'products':cat,/Actual$/.test(field)||field==='actual'?'actual':field==='commitment'?'commitment':'edit')]}
 if(name==='changeOcos')return [k('ocos',args[3]==='budget'?'edit':args[3])];
 if(['newOcosCategory','renameOcosCategory','archiveOcosCategory','restoreOcosCategory'].includes(name))return [k('ocos',name==='newOcosCategory'?'create':name==='archiveOcosCategory'?'delete':'edit')];
 if(name==='exportOcosDetail')return [k('ocos','export')];
 if(['addWorkforce','removeWorkforce','applyWorkforce'].includes(name))return name==='applyWorkforce'?[k('workforce','edit'),k('person_salary','edit'),k('person_social','edit')]:[k('workforce',name==='addWorkforce'?'create':'delete')];
 if(['changeMaster','masterForm','archiveMaster','restoreMaster'].includes(name))return [k(master(args[name==='masterForm'?1:0]),name==='masterForm'?'create':name==='archiveMaster'?'delete':'edit')];
 if(name==='updateCenter'||name==='addCenter')return [k('masters',name==='addCenter'?'create':'edit')];
 if(name==='addEntry'||name==='deleteEntry')return [k('ledger',name==='addEntry'?'create':'delete')];
 if(name==='submitBudget')return [k('approvals','submit')];if(name==='decide'){const a=state.approvals.find(x=>x.id===args[0]);return [k('approvals',args[1]?budgetApprovalStage(a):'return')]}
 if(name==='isSaveMappings')return [k('is_bridge','edit')];if(name==='isReconcile')return [k('is_bridge','reconcile'),'is_view','is.invoice.view'];
 if(name==='importBackup')return [k('settings','restore')];if(name==='resetAll')return [k('settings','reset_current')];if(name==='clearNumericValues')return [k('settings',args[0]==='all'?'reset_all':'reset_current')];
 if(name==='exportBackup'||name==='downloadPreReset')return [k('settings','backup')];if(name==='exportWorksheet')return [k(args[0]||appTab,'export')];if(name==='exportCSV')return [k(appTab,'export')];return [];
}
function budgetApprovalStage(a){return {'Submitted':'department_approve','Department Approved':'finance_approve','Finance Approved':'director_approve'}[a?.status]||'department_approve'}
function budgetStageAllowed(a){return budgetCan('budget.approvals.'+budgetApprovalStage(a))||budgetCan('budget.approvals.return')}
const budgetActionFunctions=['newFiscalYear','switchFiscalYear','updateBudget','changeOcos','newOcosCategory','renameOcosCategory','archiveOcosCategory','restoreOcosCategory','exportOcosDetail','addWorkforce','removeWorkforce','applyWorkforce','changeMaster','masterForm','archiveMaster','restoreMaster','updateCenter','addCenter','addEntry','deleteEntry','submitBudget','decide','isSaveMappings','isReconcile','importBackup','resetAll','clearNumericValues','exportBackup','downloadPreReset','exportWorksheet','exportCSV'];
for(const name of budgetActionFunctions){const original=window[name];window[name]=function(...args){if(!BiomedPermissions.require(budgetRequired(name,args))){args[0]?.preventDefault?.();return}return original.apply(this,args)}}

if(new URLSearchParams(location.search).get('tab')==='is_bridge')appTab='is_bridge';render();
