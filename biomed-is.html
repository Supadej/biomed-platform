function base_legacyMap(){return head('Original Biomed IS source map','Mapped from the uploaded ASP.NET Web Forms source, not reconstructed by running the legacy SQL Server.')+`<div class="card"><h2>Source coverage & implementation boundary</h2><p>The supplied archive contains 60 original ASPX pages, VB.NET code-behind and ASP.NET/SQL Server dependencies. This Mac prototype recreates core workflows independently; it does not execute the legacy source or read production records. The source ZIP, database and connection strings are intentionally not distributed.</p><p><strong>Operations included:</strong> document approvals, quotations, orders, purchasing, borrowing, withdrawal, invoice/credit note, inventory ledger, warehouse checks and transfers, kit master, detailed reports and exports.</p></div>`+Object.entries(SOURCE_SECTIONS).map(([name,files])=>`<div class="card"><h2>${E(name)} — ${files.length} source screens</h2><div class="tablewrap"><table><thead><tr><th>Legacy page</th><th>Module / original purpose</th></tr></thead><tbody>${files.map(f=>`<tr><td>${E(f)}</td><td>${E(f.replace('.aspx','').replaceAll('_',' '))}</td></tr>`).join('')}</tbody></table></div></div>`).join('')}
function portalIdentity(){return BiomedPermissions.identity()}
const HAS=p=>{const permissions=portalIdentity()?.permissions||[];if(p==='is_edit')return permissions.some(k=>k.startsWith('is.')&&/\.(create|edit|submit|cancel|derive)$/.test(k));if(p==='is_approve')return permissions.some(k=>k.startsWith('is.')&&/\.(approve|reject)$/.test(k));if(p==='is_manage')return permissions.some(k=>k.startsWith('is.')&&!/\.(view|print|export)$/.test(k));return permissions.includes(p)};

function accessGate(){const i=portalIdentity();if(!i)return '<div class="card"><h1>Sign in through Staff Portal</h1><p>Sign in to the Staff Portal with your company account, then open Biomed IS.</p><a class="btn" href="/?portal">Open Staff Portal</a></div>';if(!HAS('is_view'))return '<div class="card"><h1>Biomed IS access restricted</h1><p>Ask an administrator to grant Biomed IS — View in Staff Portal → Roles & Permissions.</p><a class="btn" href="/?portal">Staff Portal</a></div>';return '';}

let menuQuery='';const expandedGroups=new Set(Object.keys(GROUPS));
function menu(){const q=menuQuery.trim().toLowerCase();let out=`<div class="is-menu-search"><label for="is-menu-filter">Find a function</label><input id="is-menu-filter" type="search" value="${E(menuQuery)}" placeholder="Search menus" oninput="IS.navSearch(this.value)"></div>`;
 const shortcuts=[['dashboard','Dashboard'],['approval','Approvals'],['stock-inventory','Stock Inventory'],['reconcile','Integration'],['reports','Reports']];
 out+=window.BiomedQuickAccess?BiomedQuickAccess.render('is',Object.values(GROUPS).flat().filter(([id])=>isPageAllowed(id)),shortcuts.map(x=>x[0]),id=>IS.go(id),()=>render()):'';
 for(const [group,entries] of Object.entries(GROUPS)){let visible=entries.filter(([id,label])=>(!q||label.toLowerCase().includes(q)||group.toLowerCase().includes(q))&&isPageAllowed(id));if(!visible.length)continue;
  out+=`<details class="is-nav-group" ${(q||expandedGroups.has(group))?'open':''} ontoggle="IS.navToggle('${E(group)}',this.open)"><summary>${E(group)} <span class="is-nav-count">${visible.length}</span></summary><div class="is-nav-items">`;
  for(const [id,label] of visible){if(TYPES[id]&&id!=='shipment')out+=`<div class="is-nav-pair"><button class="${page===id?'active':''}" onclick="IS.go('${id}')">${E(label)} records</button><button class="is-new ${page===id+'@new'?'active':''}" ${BiomedPermissions.has('is.'+id+'.create')?'':'disabled'} onclick="IS.go('${id}@new')" title="Create ${E(label)}">＋ New</button></div>`;else out+=`<button class="${page===id?'active':''}" onclick="IS.go('${id}')">${E(label)}</button>`;}out+='</div></details>';
 }return out;
}
function render(){document.body.classList.remove('show-nav');if(!isPageAllowed(page)){page=Object.values(GROUPS).flat().map(x=>x[0]).find(isPageAllowed)||'dashboard';}const gate=accessGate();if(gate){$('side').innerHTML='';$('main').innerHTML=gate;return;}$('side').innerHTML=menu();const ident=portalIdentity();const mapping={'System Admin':'admin','Managing Director':'dir','Operations Director':'dir','Business Director':'dir','Department Manager':'smgr','Accounting':'acct','Employee':'sales'};user=ident?.user?.id;const badge=$('session-user');if(badge)badge.textContent=ident?.user?.name+' · '+ident?.user?.role;$('main').innerHTML= page.startsWith('waiting-purchase')?waitingPurchases(page.endsWith('@new')):page==='outstanding'?outstandingPage():page==='dashboard'?dashboard():page==='approval'?approvals():page==='stocks'?stockLedger():page==='stock-inventory'?stockInventory():page==='expiry'?expiry():page==='trace'?trace():page==='reports'?reports():page==='lot-control'?lotControl():page==='cycle-count'?cycleCounts():page==='warehouse-move'?warehouseMoves():page==='kits'?kitsPage():page==='masters'?masters():page.startsWith('master-')?masterPage(page.slice(7)):page==='rules'?rules():page==='history'?history():page==='legacy-map'?legacyMap():page==='reconcile'?reconciliation():transactionPage(page.replace('@new',''),page.endsWith('@new'));enforceISPermissions();renderFunctionSummary();installISSuggestions();}
function head(t,sub){return `<div class="row between"><div><h1>${E(t)}</h1><p>${E(sub)}</p></div></div>`}
function badge(s){return `<span class="tag ${E(s)}">${E(s)}</span>`}
function filtered(a){return a.filter(d=>(!search||JSON.stringify(d).toLowerCase().includes(search.toLowerCase()))&&(!status||d.status===status)&&(!from||d.date>=from)&&(!to||d.date<=to))}
function filterBar(){return `<div class="filt"><label>Search<input id="search" value="${E(search)}" placeholder="Search ID, customer, reference" oninput="IS.filters('search',this.value)"></label><label>Status<select onchange="IS.filters('status',this.value)"><option value="">All</option>${['Draft','Pending','Approved','Rejected','Cancelled','Confirmed','Received','Completed','Shipped','Paid'].map(s=>`<option ${s===status?'selected':''}>${s}</option>`).join('')}</select></label><label>From date<input type="date" value="${E(from)}" onchange="IS.filters('from',this.value)"></label><label>To date<input type="date" value="${E(to)}" onchange="IS.filters('to',this.value)"></label><button class="btn alt" onclick="IS.clearFilters()">Clear</button></div>`}
function options(list,value='',labelName=false){if(list===db.warehouses)list=list.map(w=>typeof w==='string'?w:w.name);return `<option value="">Select…</option>`+list.map(i=>typeof i==='string'?`<option ${i===value?'selected':''}>${E(i)}</option>`:`<option value="${E(i.id)}" ${i.id===value?'selected':''}>${E(i.name)}${i.sku?' ('+E(i.sku)+')':''}</option>`).join('')}
function table(ds){return `<div class="tablewrap"><table><thead><tr><th>Reference / Type</th><th>Date</th><th>Customer / Supplier</th><th>Amount</th><th>Status</th><th>Created by</th><th>Actions</th></tr></thead><tbody>${ds.map(d=>`<tr><td><b>${E(d.ref)}</b><div class="help">${E(TYPES[d.kind])}</div></td><td>${E(d.date)}</td><td>${E(db.customers.concat(db.suppliers).find(x=>x.id===d.party)?.name||'—')}</td><td>${money(totals(d))}</td><td>${badge(d.status)}</td><td>${E(db.users.find(u=>u.id===d.owner)?.name||d.owner)}</td><td><div class="row"><button class="btn alt" onclick="IS.open('${d.id}')">${openId===d.id?'Hide':'Details'}</button>${['Draft','Rejected'].includes(d.status)?`<button class="btn alt" onclick="IS.edit('${d.id}')">Edit</button>`:''}${['Draft','Rejected'].includes(d.status)?`<button class="btn" onclick="IS.submit('${d.id}')">Submit</button>`:''}${d.kind==='waiting-purchase'&&['Draft','Rejected'].includes(d.status)?`<button class="btn danger" onclick="IS.waitingCancel('${E(d.id)}')">Cancel</button>`:''}${d.status==='Pending'&&canApprove(d)?`<button class="btn" onclick="IS.decide('${d.id}','Approved')">Approve</button><button class="btn danger" onclick="IS.decide('${d.id}','Rejected')">Reject</button>`:''}</div></td></tr>${openId===d.id?`<tr><td colspan="7">${detail(d)}</td></tr>`:''}`).join('')||'<tr><td colspan="7" class="empty">No records match your filters.</td></tr>'}</tbody></table></div>`}
function base_detail(d){const credit=(['customer-order','sales-order'].includes(d.kind)?customerOutstanding(d.party):'')+(d.kind==='customer-order'?customerPurchasingTrail(d):'');const children=db.documents.filter(x=>x.sourceId===d.id||x.sourceIds?.includes(d.id));const source=doc(d.sourceId);return credit+(d.sourceIds?.length?'<div class="card"><b>All source requests:</b> '+d.sourceIds.map(id=>doc(id)?documentLink(doc(id)):E(id)).join(' ')+'</div>':'')+`<div class="card" style="margin:5px"><div class="row between"><strong>Document trail · ${E(d.ref)}</strong><span>${badge(d.status)}</span></div><p>Source: ${source?documentLink(source):'Original document'} · Warehouse: ${E(d.warehouse||'—')} · Lot: ${E(d.lot||'—')} · Notes: ${E(d.notes||'—')}</p><div class="tablewrap"><table class="line-table"><thead><tr><th>Product</th><th>Quantity</th><th>Unit price</th><th>Line total</th></tr></thead><tbody>${d.lines.map(l=>`<tr><td>${E(product(l.productId)?.name||l.productId)}</td><td>${E(l.qty)}</td><td>${money(l.price)}</td><td>${money(l.qty*l.price)}</td></tr>`).join('')}</tbody></table></div><p><b>Linked following documents:</b> ${children.map(c=>documentLink(c)).join(' ')||'None yet'}</p><div class="row">${d.kind==='customer-order'&&d.status==='Approved'?`<button class="btn" onclick="IS.createWaiting('${E(d.id)}')">Create waiting to be purchased</button>`:''}${d.kind==='waiting-purchase'&&d.status==='Approved'?`<button class="btn" onclick="IS.waitingRequest('${E(d.id)}')">Create Purchase Requisition</button>`:''}${(d.kind==='waiting-purchase'?[]:FLOW[d.kind]||[]).map(k=>`<button class="btn alt" onclick="IS.derive('${d.id}','${k}')">Create ${E(TYPES[k])} ↗</button>`).join('')}${['Approved','Confirmed','Received'].includes(d.status)&&d.kind==='invoice'?'<button class="btn alt" onclick="IS.bridge()">Sync to Staff Portal</button>':''}</div><p class="help">Approval history: ${E((d.history||[]).map(h=>`${h.status} by ${h.by} ${h.at.slice(0,16)}${h.reason?' — '+h.reason:''}`).join(' | ')||'Not submitted')}</p></div>`}
function canApprove(d){return (BiomedPermissions.has('is.'+d.kind+'.approve')||BiomedPermissions.has('is.'+d.kind+'.reject'))&&(db.settings.allowSelfApproval||user!==d.owner)}
function base_draftForm(kind){const d=doc(editId),existing=d?.kind===kind?d:null;return `<div class="card"><div class="row between"><h2>${existing?'Edit':'Create'} ${E(TYPES[kind])}</h2>${existing?'<button class="btn alt" onclick="IS.cancelEdit()">Cancel edit</button>':''}</div><form onsubmit="IS.save(event,'${kind}')"><div class="form"><label>Reference<input name="ref" required value="${E(existing?.ref||'BIO-'+kind.toUpperCase().slice(0,3)+'-'+Date.now().toString().slice(-7))}"></label><label>Transaction date<input type="date" name="date" required value="${E(existing?.date||date())}"></label><label>Currency<select name="currency">${['THB','USD','EUR','SGD','JPY'].map(x=>`<option ${x===(existing?.currency||'THB')?'selected':''}>${x}</option>`).join('')}</select></label><label>Customer / supplier<select name="party">${options(kind.includes('purchase')||kind==='supplier-confirm'||kind==='delivery-in'?db.suppliers:db.customers,existing?.party)}</select></label><label>Linked previous document<select name="sourceId">${options(db.documents.filter(x=>(kind==='waiting-purchase'?x.kind==='customer-order':x.kind!==kind)&&['Approved','Confirmed','Received','Completed'].includes(x.status)).map(x=>({id:x.id,name:x.ref+' · '+TYPES[x.kind]})),existing?.sourceId)}</select></label><label>Warehouse<select name="warehouse">${options(db.warehouses.map(w=>typeof w==='string'?w:w.name),existing?.warehouse)}</select></label><label>Lot / batch<input name="lot" value="${E(existing?.lot||'')}" placeholder="Required for stock movement"></label><label>Expiry date<input type="date" name="expiry" value="${E(existing?.expiry||'')}"></label><label>Customer PO / supplier reference<input name="externalRef" value="${E(existing?.externalRef||'')}"></label><label>Staff Portal sales representative<select name="portalRep">${options(portalUsers(),existing?.portalRep)}</select></label><label>Sales product line<input name="portalLine" value="${E(existing?.portalLine||'Diagnostics')}" placeholder="Diagnostics / Life Science Research"></label><label>Expected / delivery date<input type="date" name="due" value="${E(existing?.due||'')}"></label><label class="wide">Business reason / instructions<textarea name="notes" rows="2">${E(existing?.notes||'')}</textarea></label></div><h2 style="margin-top:18px">Line items</h2><div class="lineform"><label>Scan product barcode<input id="source-barcode" placeholder="Scan barcode and press Enter" onkeydown="if(event.key==='Enter'){event.preventDefault();IS.sourceScan(this.value)}"></label><label>Find product<input id="source-product-search" type="search" placeholder="Product name, catalogue number or ID"></label><label>Product<select id="lineprod">${options(db.products.filter(p=>p.active!==false).slice(0,100))}</select></label><label>Quantity<input id="lineqty" type="number" min="${kind==='stock-count'?'0':'0.001'}" step="0.001" value="1"></label><label>Unit price<input id="lineprice" type="number" min="0" step="0.01" value="0"></label><label>Lot (optional)<input id="linelot" placeholder="Lot"></label><button type="button" class="btn alt" onclick="IS.addLine()">Add line</button></div><div id="lines">${lineMarkup()}</div><div class="row" style="margin-top:17px"><button class="btn" type="submit">${existing?'Save draft changes':'Save as draft'}</button><span class="help">Submit for approval from the register after saving.</span></div></form></div>`}
function base_lineMarkup(){return `<div class="tablewrap" style="margin-top:12px"><table class="line-table"><thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Line amount</th><th></th></tr></thead><tbody>${lines.map((l,i)=>`<tr><td>${E(product(l.productId)?.name)}</td><td>${E(l.qty)}</td><td>${money(l.price)}</td><td>${money(l.price*l.qty)}</td><td><button class="btn danger" type="button" onclick="IS.delLine(${i})">Remove</button></td></tr>`).join('')||'<tr><td colspan="5">Add at least one product line.</td></tr>'}</tbody></table></div><p><b>Total: ${money(lines.reduce((s,l)=>s+l.qty*l.price,0))}</b></p>`}
function transactionPage(kind,creating=false){const matching=filtered(db.documents.filter(d=>d.kind===kind));if(kind==='shipment')return head('To Shipment','Automatically generated when a Check Out is approved; creation from this screen is disabled.')+`<div class="card"><h2>Shipment register (${matching.length})</h2>${filterBar()}${table(matching)}</div>`;
if(kind==='stock-count')return cycleCounts();if(kind==='stock-transfer')return warehouseMoves();if(creating)return head('New '+(TYPES[kind]||kind),'Create a draft using the source-mapped fields; review and submit from Records.')+`<div class="record-tabs"><button class="btn alt" onclick="IS.go('${kind}')">← ${E(TYPES[kind])} records</button></div>`+draftForm(kind);
return head(TYPES[kind]||kind,'Transaction records and approval history are separated from creation.')+`<div class="record-tabs"><button class="btn" onclick="IS.go('${kind}@new')">＋ New ${E(TYPES[kind])}</button><button class="btn alt" onclick="IS.export('${kind}')">Export CSV</button></div><div class="card"><h2>Transaction Register (${matching.length})</h2>${filterBar()}${table(matching)}</div>`;}
function dashboard(){const all=db.documents;return head('Operations dashboard','Sales → Purchasing → Warehouse → Invoice, with approvals and traceability')+`<div class="note">This local test build saves to SQLite and checks module permissions from the signed-in role. It is not the original SQL Server transaction engine. The source screenshots informed document types, while unshown business rules are proposals.</div><div class="grid"><div class="stat"><small>Documents</small><strong>${all.length}</strong></div><div class="stat"><small>Awaiting approval</small><strong>${all.filter(x=>x.status==='Pending').length}</strong></div><div class="stat"><small>Approved invoices</small><strong>${money(all.filter(x=>x.kind==='invoice'&&x.status==='Approved').reduce((s,x)=>s+totals(x),0))}</strong></div><div class="stat"><small>Stock movements</small><strong>${db.movements.length}</strong></div></div><div class="card"><h2>Operational sequence</h2><p><b>Sales:</b> Quotation → Customer Order → Sales Order → Delivery Out → Check Out → Shipment → Invoice</p><p><b>Purchasing:</b> Purchase Requisition → Purchase Order → Supplier Confirmation → Delivery In → Check In</p><p><b>Exception:</b> Borrowing → Delivery Out → Return Product; Withdrawal → Delivery Out; Invoice → Credit Note / Receipt.</p></div><div class="card"><div class="row between"><h2>Pending approvals</h2><button class="btn" onclick="IS.go('approval')">Review approvals</button></div>${table(db.documents.filter(x=>x.status==='Pending').slice(0,8))}</div>`}
function approvals(){const list=filtered(db.documents.filter(x=>x.status==='Pending'));return head('Approval Center','Pending documents grouped by approval type.')+`<div class="card">${filterBar()}${Object.entries(TYPES).map(([kind,label])=>{const rows=list.filter(d=>d.kind===kind);return rows.length?`<details open class="bm-approval-category"><summary>${E(label)} · ${rows.length} awaiting approval</summary>${table(rows)}</details>`:''}).join('')||'<p>No pending approvals match your filters.</p>'}</div>`}

function stockBalance(prod,warehouse,lot){return db.movements.filter(m=>(!prod||m.productId===prod)&&(!warehouse||m.warehouse===warehouse)&&(!lot||m.lot===lot)).reduce((s,m)=>s+Number(m.change),0)}
function stocks(){return head('Stock Inventory by Lot','Traceable stock movements; no double posting per source document.')+`<div class="card"><div class="row between"><h2>Available stock ledger</h2><button class="btn alt" onclick="IS.export('movements')">Export movements</button></div><div class="tablewrap"><table><thead><tr><th>Product</th><th>Warehouse</th><th>Lot</th><th>Balance</th><th>Expiry</th><th>Trace</th></tr></thead><tbody>${Array.from(new Set(db.movements.map(m=>m.productId+'|'+m.warehouse+'|'+m.lot))).map(k=>{const [p,w,l]=k.split('|'),items=db.movements.filter(x=>x.productId===p&&x.warehouse===w&&x.lot===l);return `<tr><td>${E(product(p)?.name)}</td><td>${E(w)}</td><td>${E(l)}</td><td>${E(stockBalance(p,w,l))}</td><td>${E(items.find(x=>x.expiry)?.expiry||'—')}</td><td>${items.length} movement(s)</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">No posted stock. Create and approve Delivery In, then Check In.</td></tr>'}</tbody></table></div></div>`}
function base_stockInventory(){const lots=uniqueLots(),grouped=new Map(),q=stockF.text.toLowerCase().trim();for(const r of lots){const p=product(r.productId);if(stockF.product!=='all'&&stockF.product!==r.productId)continue;if(stockF.warehouse!=='all'&&stockF.warehouse!==r.warehouse)continue;if(q&&![p?.name,p?.sku,p?.id,r.warehouse,r.lot].some(v=>String(v||'').toLowerCase().includes(q)))continue;const k=r.productId+'|'+r.warehouse,ex=grouped.get(k)||{productId:r.productId,warehouse:r.warehouse,physical:0,available:0,lots:0,nextExpiry:''};ex.physical+=r.qty;ex.available+=r.held||r.expiry&&r.expiry<date()?0:Math.max(0,r.qty);ex.lots++;if(r.expiry&&(!ex.nextExpiry||r.expiry<ex.nextExpiry))ex.nextExpiry=r.expiry;grouped.set(k,ex)}return head('Stock Inventory','Product availability aggregated across posted lots, including product master details.')+`<div class="card">${lotFilterControls()}${rtable(['Product ID','SKU','Product description','Brand','Category','Unit','Storage','Warehouse','Physical stock','Available stock','Lots','Next expiry'],[...grouped.values()].map(r=>{const p=product(r.productId)||{};return [E(r.productId),E(p.sku||''),E(p.name||''),E(p.brand||''),E(p.category||p.line||''),E(p.unit||''),E(p.storage||''),E(r.warehouse),pretty(r.physical),pretty(r.available),r.lots,E(r.nextExpiry||'—')]}))}</div>`}
function stockLedger(){return head('Stock Ledger','Detailed stock movement history, with posting source, batch, warehouse and quantity changes.')+`<div class="card">${lotFilterControls()}<button class="btn alt" onclick="IS.export('movements')">Export stock movements CSV</button>${rtable(['Posting time','Document source','Product ID','Product description','Warehouse','Lot','Expiry','Quantity change','Running balance'],db.movements.filter(m=>(stockF.product==='all'||m.productId===stockF.product)&&(stockF.warehouse==='all'||m.warehouse===stockF.warehouse)&&(!stockF.text||[m.lot,m.productId,product(m.productId)?.name].some(x=>String(x||'').toLowerCase().includes(stockF.text.toLowerCase())))).sort((a,b)=>String(a.at).localeCompare(String(b.at))).map((m,i,a)=>[E(m.at.slice(0,19)),E(db.documents.find(x=>x.id===m.sourceId)?.ref||m.sourceId||'—'),E(m.productId),E(product(m.productId)?.name||''),E(m.warehouse),E(m.lot),E(m.expiry||''),pretty(m.change),pretty(a.slice(0,i+1).filter(x=>x.productId===m.productId&&x.warehouse===m.warehouse&&x.lot===m.lot).reduce((n,x)=>n+Number(x.change),0))]))}</div>`}

function csvParse(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++;}else if(c==='"')quoted=false;else cell+=c;}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x!==''))rows.push(row);row=[];cell='';}else cell+=c;}row.push(cell);if(row.some(x=>x!==''))rows.push(row);return rows}

function applyStock(d){if(!['check-in','check-out','return-product','stock-adjust','stock-transfer'].includes(d.kind))return true;if(db.movements.some(x=>x.sourceId===d.id))return true;const sign=['check-in','return-product'].includes(d.kind)?1:-1;for(const l of d.lines){const lot=l.lot||d.lot||'UNSPECIFIED';if(sign<0&&(stockBalance(l.productId,d.warehouse||'Main Warehouse',lot)<Number(l.qty)||uniqueLots().some(x=>x.productId===l.productId&&x.warehouse===(d.warehouse||'Main Warehouse')&&x.lot===lot&&(x.held||x.expiry&&x.expiry<date())))){notification(`Insufficient stock for ${product(l.productId)?.name}, lot ${lot}. Available ${stockBalance(l.productId,d.warehouse||'Main Warehouse',lot)}.`);return false}}for(const l of d.lines)db.movements.push({id:uid(),sourceId:d.id,at:new Date().toISOString(),productId:l.productId,warehouse:d.warehouse||'Main Warehouse',lot:l.lot||d.lot||'UNSPECIFIED',expiry:d.expiry||'',change:sign*Number(l.qty)});log('Stock posted',d.ref,`${sign>0?'+':'-'} stock from ${TYPES[d.kind]}`);return true}

let stockF={product:'all',warehouse:'all',text:''};
function uniqueLots(){let map=new Map();for(const m of db.movements){let key=[m.productId,m.warehouse,m.lot].join('|'),r=map.get(key)||{productId:m.productId,warehouse:m.warehouse,lot:m.lot,qty:0,expiry:''};r.qty+=Number(m.change);if(m.expiry)r.expiry=m.expiry;map.set(key,r)}return [...map.values()].map(r=>({...r,held:db.quarantines.filter(q=>q.productId===r.productId&&q.warehouse===r.warehouse&&q.lot===r.lot).slice(-1)[0]?.status==='Held'}))}
function matchLot(r){return (stockF.product==='all'||[r.productId,product(r.productId)?.name,product(r.productId)?.brand,product(r.productId)?.catalogueNo].some(v=>String(v||'').toLowerCase().includes(stockF.product.toLowerCase())))&&(stockF.warehouse==='all'||r.warehouse===stockF.warehouse)&&(!stockF.text||JSON.stringify(r).toLowerCase().includes(stockF.text.toLowerCase()))}
function lotFilterControls(){return `<div class="r-filters"><label>Product search<input type="search" placeholder="Type product ID, brand, catalogue or description" value="${E(stockF.product==='all'?'':stockF.product)}" onchange="IS.lotFilter('product',this.value||'all')"></label><label>Warehouse<select onchange="IS.lotFilter('warehouse',this.value)">${dropdown([['all','All warehouses'],...db.warehouses.map(w=>{const n=typeof w==='string'?w:w.name;return [n,n]})],stockF.warehouse)}</select></label><label>Lot search<input value="${E(stockF.text)}" onchange="IS.lotFilter('text',this.value)"></label></div>`}
function lotControl(){const keys=uniqueLots().filter(matchLot);return head('Lot Control & Quarantine','Prevent held and expired lots from being issued. Authorization required for release.')+`<div class="card">${lotFilterControls()}${rtable(['Product','Warehouse','Lot','Expiry','Physical balance','QC status','Action'],keys.map(k=>[E(product(k.productId)?.name||k.productId),E(k.warehouse),E(k.lot),E(k.expiry||'—'),pretty(k.qty),k.held?'Held':k.expiry&&k.expiry<date()?'Expired':'Released',`<button class="btn alt" onclick="IS.toggleHold('${E(k.productId)}','${E(k.warehouse)}','${E(k.lot)}')">${k.held?'Release':'Quarantine'}</button>`]))}</div><div class="card"><h2>Disposition history</h2>${rtable(['Date','Product','Warehouse','Lot','Disposition','Authorized by','Reason'],db.quarantines.map(q=>[E(q.at.slice(0,16)),E(product(q.productId)?.name||q.productId),E(q.warehouse),E(q.lot),E(q.status),E(q.by),E(q.reason)]))}</div>`}
function cycleCounts(){return head('Physical Stock Checks','Count physical stock by lot. Approval posts only the variance, never the full quantity.')+`<div class="card"><h2>Record a physical stock count</h2><form class="r-filters" onsubmit="IS.newCount(event)"><label>Product<select name="productId" required>${options(db.products)}</select></label><label>Warehouse<select name="warehouse">${db.warehouses.map(w=>`<option>${E(w)}</option>`).join('')}</select></label><label>Lot<input name="lot" required></label><label>Counted quantity<input name="count" type="number" min="0" step="0.001" required></label><label>Comment<input name="comment" placeholder="Counting reference, variance explanation"></label><button class="btn">Save count for approval</button></form></div><div class="card"><h2>Count history</h2>${rtable(['Reference','Date','Product / lot','Warehouse','System qty','Counted qty','Variance','Status','Actions'],db.stockChecks.map(c=>[E(c.ref),E(c.at.slice(0,10)),E(product(c.productId)?.name||c.productId)+' / '+E(c.lot),E(c.warehouse),pretty(c.system),pretty(c.count),pretty(c.count-c.system),badge(c.status),c.status==='Pending'?`<button class="btn alt" onclick="IS.decideCount('${c.id}',true)">Approve</button> <button class="btn danger" onclick="IS.decideCount('${c.id}',false)">Reject</button>`:'—']))}</div>`}
function warehouseMoves(){return head('Warehouse Location Transfers','Approved internal transfers deduct from source and credit destination exactly once.')+`<div class="card"><h2>Create stock transfer</h2><form class="r-filters" onsubmit="IS.newMove(event)"><label>Product<select name="productId" required>${options(db.products)}</select></label><label>From warehouse<select name="from">${db.warehouses.map(w=>`<option>${E(w)}</option>`).join('')}</select></label><label>To warehouse<select name="to">${db.warehouses.map(w=>`<option>${E(w)}</option>`).join('')}</select></label><label>Lot<input name="lot" required></label><label>Quantity<input name="qty" type="number" min="0.001" step="0.001" required></label><label>Reason<input name="reason" required></label><button class="btn">Submit transfer</button></form></div><div class="card"><h2>Transfer history</h2>${rtable(['Date','Product','Lot','From','To','Quantity','Status','Action'],db.warehouseMoves.map(m=>[E(m.at.slice(0,10)),E(product(m.productId)?.name||m.productId),E(m.lot),E(m.from),E(m.to),pretty(m.qty),badge(m.status),m.status==='Pending'?`<button class="btn alt" onclick="IS.decideMove('${m.id}',true)">Approve</button> <button class="btn danger" onclick="IS.decideMove('${m.id}',false)">Reject</button>`:'—']))}</div>`}
function kitsPage(){return head('Product Panels / Kits','Bill of materials: parent kit with individual product components. Stock availability considers the complete kit.')+`<div class="card"><h2>Define a panel or kit</h2><form class="r-filters" onsubmit="IS.addKit(event)"><label>Panel / kit name<input name="name" required></label><label>Parent product ID<input name="parent" placeholder="Optional catalogue ID"></label><label>Components (Product ID:Quantity per line)<textarea name="components" rows="5" placeholder="P001:2&#10;P003:1" required></textarea></label><button class="btn">Save kit definition</button></form><p class="help">Use product IDs from Master Data. A kit definition does not create physical stock by itself.</p></div><div class="card"><h2>Product panels and available component balances</h2>${rtable(['Panel / kit','Parent reference','Components','Availability (estimated)','Action'],db.kits.map(k=>[E(k.name),E(k.parent||'—'),E(k.components.map(c=>`${product(c.id)?.name||c.id} × ${c.qty}`).join(' · ')),Math.max(0,Math.floor(Math.min(...k.components.map(c=>{const qty=uniqueLots().filter(l=>l.productId===c.id&&!l.held&&(!l.expiry||l.expiry>=date())).reduce((s,l)=>s+Math.max(0,l.qty),0);return qty/c.qty}))))+ ' kits',`<button class="btn danger" onclick="IS.removeKit('${k.id}')">Remove</button>`]))}</div>`}
const IS_FM={

function buildBrandRequest(ids,brand,currency){const selected=[...new Set(ids)].map(doc);if(!selected.length||selected.some(q=>q?.kind!=='waiting-purchase'||q.status!=='Approved'||(q.currency||'THB')!==currency||q.sourceId&&doc(q.sourceId)?.status!=='Approved'))throw Error('Select approved requests with the same currency and approved source orders.');const grouped=new Map(),allocations=[];for(const q of selected)for(const [i,l] of q.lines.entries()){if(waitingBrand(l)!==brand)continue;const qty=Number((Number(l.qty)-reservedWaiting(q.id,i)).toFixed(6));if(qty<=0)continue;const unit=l.unit||product(l.productId)?.unit||'',price=Number(l.price||0),key=JSON.stringify([l.productId,unit,price]);if(!grouped.has(key))grouped.set(key,{productId:l.productId,description:l.description||product(l.productId)?.name||'',unit,price,qty:0,brand});const line=grouped.get(key);line.qty=Number((line.qty+qty).toFixed(6));allocations.push({requestId:q.id,requestLine:i,productId:l.productId,unit,price,qty})}if(!allocations.length)throw Error('Selected requests have no remaining quantity for this brand.');const sourceIds=[...new Set(allocations.map(a=>a.requestId))];return {id:uid(),kind:'purchase-request',ref:'PR-BRAND-'+Date.now(),date:date(),sourceId:sourceIds[0],sourceIds,sourceAllocations:allocations,purchasingBrand:brand,currency,party:'',lines:[...grouped.values()],status:'Draft',owner:user,created:new Date().toISOString(),history:[],notes:'Combined brand purchasing request: '+sourceIds.map(id=>doc(id).ref).join(', ')}}

function analysisRows(){const kinds=[analysis.a,analysis.b],saved=rp.kind;rp.kind='all';const docs=reportDocs();rp.kind=saved;return docs.filter(d=>kinds.includes(d.kind)&&isPageAllowed(d.kind)).flatMap(d=>(d.lines||[]).filter(l=>reportProductMatch(l.productId)).map((l,i)=>({d,l,i,unit:l.unit||product(l.productId)?.unit||'Unspecified',currency:d.currency||'THB',amount:Number(l.qty||0)*Number(l.price||0)})))}
function analysisGroups(rows){const groups=new Map();for(const r of rows){const value=analysis.group==='month'?String(r.d.date||'Undated').slice(0,7):analysis.group==='party'?r.d.party||'Unassigned':r.l.productId;const key=JSON.stringify([value,r.unit,r.currency]);if(!groups.has(key))groups.set(key,{value,unit:r.unit,currency:r.currency,a:0,b:0,aq:0,bq:0});const g=groups.get(key),side=r.d.kind===analysis.a?'a':'b';g[side]+=r.amount;g[side+'q']+=Number(r.l.qty||0)}return [...groups.values()]}
function reportAnalysis(){const rows=analysisRows(),groups=analysisGroups(rows),size=50,max=Math.max(1,Math.ceil(rows.length/size));analysis.page=Math.min(analysis.page,max);const opts=selected=>dropdown(Object.entries(TYPES).filter(([id])=>isPageAllowed(id)),selected);return `<section class="card"><h2>Compare functions & inspect source lines</h2><div class="bm-analysis-controls"><label>Function A<select onchange="IS.analysisFilter('a',this.value)">${opts(analysis.a)}</select></label><label>Function B<select onchange="IS.analysisFilter('b',this.value)">${opts(analysis.b)}</select></label><label>Group by<select onchange="IS.analysisFilter('group',this.value)">${dropdown([['product','Product'],['party','Customer / supplier ID'],['month','Month']],analysis.group)}</select></label></div><p class="help">Uses date, status, employee, product, currency, warehouse and text filters above. Transaction type is set independently here. Values are line quantity × unit price, before document discounts and VAT. Functions are compared separately; differences do not prove fulfilment. Use source links to verify. Currencies and units remain separate.</p>${rtable(['Group','Unit','Currency',TYPES[analysis.a]+' qty',TYPES[analysis.b]+' qty','Quantity gap',TYPES[analysis.a]+' line value',TYPES[analysis.b]+' line value'],groups.slice(0,200).map(g=>[E(analysis.group==='product'?product(g.value)?.name||g.value:g.value),E(g.unit),E(g.currency),pretty(g.aq),pretty(g.bq),pretty(g.aq-g.bq),pretty(g.a),pretty(g.b)]))}${groups.length>200?'<p>First 200 groups displayed; export contains all filtered lines.</p>':''}<details class="bm-analysis-detail"><summary>Detailed source lines · ${rows.length} matching lines</summary>${rtable(['Open document','Date','Function','Status','Party ID','Product ID','Product','Lot','Expiry','Warehouse','Qty','Unit','Unit price','Line value','Currency','Source'],rows.slice((analysis.page-1)*size,analysis.page*size).map(r=>[documentLink(r.d),E(r.d.date),E(TYPES[r.d.kind]),badge(r.d.status),E(r.d.party),E(r.l.productId),E(product(r.l.productId)?.name),E(r.l.lot),E(r.l.expiry),E(r.d.warehouse),pretty(r.l.qty),E(r.unit),pretty(r.l.price),pretty(r.amount),E(r.currency),doc(r.d.sourceId)?documentLink(doc(r.d.sourceId)):E(r.d.sourceId)]))}<div class="row" style="margin-top:12px"><button class="btn alt" onclick="IS.analysisFilter('page',${analysis.page-1})" ${analysis.page<=1?'disabled':''}>Previous</button><span>Page ${analysis.page} / ${max}</span><button class="btn alt" onclick="IS.analysisFilter('page',${analysis.page+1})" ${analysis.page>=max?'disabled':''}>Next</button></div></details><button class="btn alt" onclick="IS.analysisExport()">Export comparison source lines CSV</button></section>`}
IS.analysisFilter=(k,v)=>{if(!['a','b','group','page'].includes(k))return;analysis[k]=k==='page'?Math.max(1,Number(v)):v;if(k!=='page')analysis.page=1;render()};
IS.analysisExport=()=>{if(!BiomedPermissions.require(['is.reports.export']))return;fileCSV('comparison-source-lines.csv',[['Reference','Date','Function','Status','Party ID','Product ID','Lot','Expiry','Warehouse','Quantity','Unit','Unit price','Line value before discount/VAT','Currency','Source ID'],...analysisRows().map(r=>[r.d.ref,r.d.date,TYPES[r.d.kind],r.d.status,r.d.party,r.l.productId,r.l.lot,r.l.expiry,r.d.warehouse,r.l.qty,r.unit,r.l.price,r.amount,r.currency,r.d.sourceId])])};

function isPageAllowed(k){return HAS('is_view')&&BiomedPermissions.has('is.'+k.replace('@new','')+'.view')}
function isRequired(method,args){const current=page.replace('@new',''),kind=id=>doc(id)?.kind||current,k=(m,a)=>'is.'+m+'.'+a;
 if(['waitingTab','waitingSelectAll'].includes(method))return [k('waiting-purchase','view')];if(method==='waitingBatch')return [k('waiting-purchase','view'),k('waiting-purchase','derive'),k('purchase-request','view'),k('purchase-request','create')];if(method==='createWaiting')return [k('waiting-purchase','create'),k('customer-order','derive')];if(method==='waitingRequest')return [k('waiting-purchase','derive'),k('purchase-request','create')];if(method==='waitingCancel')return [k('waiting-purchase','cancel')];if(['save','sourceSave'].includes(method))return [k(args[1]||current,editId?'edit':'create')];
 if(['edit','sourceEditLine','sourceSet','sourceVat','sourceAddLine','sourceProduct','sourceResetLine','sourceLoadParty','sourceFillDelivery','sourceLink','addLine','delLine'].includes(method))return [k(method==='edit'?kind(args[0]):current,editId?'edit':'create')];
 if(method==='submit')return [k(kind(args[0]),'submit')];if(method==='decide')return [k(kind(args[0]),args[1]==='Approved'?'approve':'reject')];
 if(method==='sourceCancel')return [k(kind(args[0]),'cancel')];if(method==='derive')return [k(kind(args[0]),'derive'),k(args[1],'create')];
 if(['sourcePrint','open'].includes(method))return [k(kind(args[0]),method==='sourcePrint'?'print':'view')];
 if(method==='masterSave')return [k('master-'+args[1],masterEdit?'edit':'create')];if(method==='masterEdit')return [k('master-'+args[0],'edit')];
 if(['masterToggle','masterRemove','masterImport','masterExport','master'].includes(method))return [k('master-'+args[0],{masterToggle:'deactivate',masterRemove:'delete',masterImport:'import',masterExport:'export',master:'create'}[method])];
 if(method==='toggleHold'){const lot=uniqueLots().find(l=>l.productId===args[0]&&l.warehouse===args[1]&&l.lot===args[2]);return [k('lot-control',lot?.held?'release':'hold')]}
 if(['newCount','decideCount','newMove','decideMove','addKit','removeKit'].includes(method))return [k({newCount:'cycle-count',decideCount:'cycle-count',newMove:'warehouse-move',decideMove:'warehouse-move',addKit:'kits',removeKit:'kits'}[method],method.startsWith('decide')?(args[1]?'approve':'reject'):method==='removeKit'?'delete':'create')];
 if(method==='sourceRestore')return [k('backup','restore')];if(['backup','downloadBridge'].includes(method))return [k('backup','export')];
 if(method==='exportReport')return [k(args[0]==='audit'?'history':args[0]==='stock'?'stock-inventory':'reports','export')];
 if(method==='export')return [k(args[0]==='movements'?'stocks':args[0]==='all'?'reports':args[0]==='approval'?'approval':args[0],'export')];
 if(method==='bridge')return [k('reconcile','edit')];if(method==='consumePortalOrder')return [k('sales-order','create'),k('quotation','derive')];return [];
}
function enforceISPermissions(){BiomedPermissions.decorate($('main'),isRequired,'IS\\.');}
for(const name of Object.keys(IS)){const original=IS[name];if(typeof original!=='function')continue;IS[name]=function(...args){if(name==='go'){const target=String(args[0]).replace('@new','');if(!isPageAllowed(target)||String(args[0]).includes('@new')&&!BiomedPermissions.has('is.'+target+'.create'))return notification('Your role does not have access to this function.')}if(!BiomedPermissions.require(isRequired(name,args)))return;return original.apply(this,args)}}

render();
if(new URLSearchParams(window.location.search).has('fromPortal'))IS.consumePortalOrder();
})();
</script></body></html>
